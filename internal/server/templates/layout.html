<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>go-tari-explorer</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: monospace; margin: 2rem; background: #0f0f12; color: #e6e6e6; }
        a { color: #7cc7ff; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: 0.4rem 0.8rem; border-bottom: 1px solid #333; }
        th { color: #999; }
        .pool-own { color: #7fffa0; }
        .pool-unknown { color: #888; }
        #load-more-row td { text-align: center; padding: 1rem; }
        button { background: #222; color: #e6e6e6; border: 1px solid #444; padding: 0.5rem 1rem; cursor: pointer; }
        button:hover { background: #333; }
        nav { margin-bottom: 1rem; color: #999; }
        nav a { margin-right: 0.3rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .stat-card { border: 1px solid #333; padding: 1rem; background: #17171b; }
        .stat-card .label { color: #999; font-size: 0.85rem; }
        .stat-card .value { font-size: 1.4rem; color: #7fffa0; }
    </style>
</head>
<body>
<h1><a href="/">go-tari-explorer</a></h1>
<nav><a href="/">Blocks</a> | <a href="/pool-stats">Pool Stats</a> | <a href="/analysis">Analysis</a></nav>
{{block "content" .}}{{end}}
</body>
</html>
